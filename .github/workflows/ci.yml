name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, zip
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: vendor/bin/pint --test

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, zip
          coverage: none

      - uses: ramsey/composer-install@v3

      # Larastan boots the application to resolve Laravel's types, so it
      # needs a .env with an APP_KEY (no database connection is required:
      # model columns are read from database/schema/mysql-schema.sql).
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  tests:
    name: PHPUnit
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          # intl: ItaijiNormalizer (Normalizer), zip: RhbXlsxReader / bundle expanders
          extensions: intl, zip, pdo_mysql, xmlreader, simplexml, mbstring, bcmath
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # RefreshDatabase loads database/schema/mysql-schema.sql through the
      # mysql CLI, which the ubuntu runner image already provides.
      - run: php artisan test --compact
