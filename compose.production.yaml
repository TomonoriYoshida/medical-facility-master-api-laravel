# Production stack for a single persistent server: see DEPLOY.md.
# Run every command with `docker compose -f compose.production.yaml ...`.
#
# app, worker and scheduler run the same image. They share the
# storage-app volume because rhb:download (run by the scheduler) saves each
# dataset under storage/app and records that path, and the queued import job
# (run by the worker) reads the file back from the same path.
#
# storage/logs is a volume too, so the logs outlive the containers (which
# every deploy recreates): Laravel's daily files from all three services,
# the app's access log, and the alert channel's deduplication record.

x-app: &app
    build: .
    image: medical-facility-master-api:latest
    restart: unless-stopped
    env_file: .env
    volumes:
        - 'storage-app:/app/storage/app'
        - 'storage-logs:/app/storage/logs'
    depends_on:
        mysql:
            condition: service_healthy
    logging: &logging
        driver: json-file
        options:
            max-size: '10m'
            max-file: '5'

services:
    app:
        <<: *app
        environment:
            # A hostname (e.g. 203-0-113-1.sslip.io) makes Caddy serve HTTPS
            # with an automatic Let's Encrypt certificate; ":80" serves plain
            # HTTP only.
            SERVER_NAME: '${SERVER_NAME:?SERVER_NAME must be set in .env}'
            # Access log (JSON, one file per day, kept 14 days). Caddy
            # redacts the Cookie and Authorization headers by default.
            CADDY_SERVER_EXTRA_DIRECTIVES: |
                log {
                    output file /app/storage/logs/access.log {
                        roll_interval 24h
                        roll_keep_for 336h
                    }
                    format json
                }
                # The everyday-use site (open-clinic-finder), a static
                # export built on this server, is served at / ahead of
                # Laravel. Paths it has no file for (and /api, /docs, /up)
                # fall through to php_server as before.
                @frontend {
                    not path /api/* /docs/* /up
                    file {
                        root /srv/open-clinic-finder/out
                        try_files {path}/index.html {path}
                    }
                }
                handle @frontend {
                    root * /srv/open-clinic-finder/out
                    try_files {path}/index.html {path}
                    header {
                        Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cyberjapandata.gsi.go.jp; connect-src 'self' https://msearch.gsi.go.jp; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
                        X-Content-Type-Options nosniff
                        Referrer-Policy strict-origin-when-cross-origin
                        Permissions-Policy "geolocation=(self), camera=(), microphone=()"
                        Strict-Transport-Security max-age=31536000
                    }
                    # Hashed file names: a new build never reuses one. Pages
                    # and the rest are checked on every visit.
                    @hashed path /_next/static/*
                    @unhashed not path /_next/static/*
                    header @hashed Cache-Control "public, max-age=31536000, immutable"
                    header @unhashed Cache-Control "no-cache"
                    file_server
                }
        ports:
            - '80:80'
            - '443:443'
            - '443:443/udp'
        volumes:
            - 'storage-app:/app/storage/app'
            - 'storage-logs:/app/storage/logs'
            - 'caddy-data:/data/caddy'
            - 'caddy-config:/config/caddy'
            # The whole checkout, not out/: a build replaces out/, and a
            # bind mount of it would keep pointing at the removed directory.
            - '${FRONTEND_DIR:-../open-clinic-finder}:/srv/open-clinic-finder:ro'

    worker:
        <<: *app
        command: ['php', 'artisan', 'queue:work', '--sleep=3', '--max-time=3600']
        # queue:work finishes the job in progress before exiting on SIGTERM;
        # ImportRhbFacilityListJob may run for up to its 600s timeout.
        stop_grace_period: 10m
        # The image's healthcheck probes Caddy, which only the app runs.
        healthcheck:
            disable: true

    scheduler:
        <<: *app
        command: ['php', 'artisan', 'schedule:work']
        healthcheck:
            disable: true

    mysql:
        image: 'mysql:8.4'
        restart: unless-stopped
        # --innodb-buffer-pool-size: medical_facilities alone exceeds MySQL's
        # default 128MB buffer pool, which forces every search full scan to
        # hit disk (~1-2s vs ~0.1-0.25s).
        # --skip-log-bin: binary logs are only needed for replication and
        # point-in-time recovery; a full import writes ~1.2GB of them.
        # Backups are daily mysqldump files instead (DEPLOY.md).
        command: '--innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-512M} --skip-log-bin'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set in .env}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD:?DB_PASSWORD must be set in .env}'
        volumes:
            - 'mysql-data:/var/lib/mysql'
        healthcheck:
            # Over TCP, not the socket: on the first start the image initializes
            # the database with a temporary server that has networking off, and
            # a socket ping would report it healthy while the app still cannot
            # connect (the first migrate then fails with "Connection refused").
            test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
            interval: 10s
            retries: 10
            timeout: 5s
        logging: *logging

volumes:
    storage-app:
    storage-logs:
    caddy-data:
    caddy-config:
    mysql-data:
